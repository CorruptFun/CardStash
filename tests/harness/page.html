<!doctype html>
<meta charset="utf-8" />
<!-- The app serves from the origin root, and ocr.ts resolves its worker via
     document.baseURI — mirror that here so /ocr middleware serves it. -->
<base href="/" />
<title>Cardstock scan harness</title>
<body>
  <!--
    Harness page, served by the Vite dev server so /src TypeScript modules load
    with the app's real toolchain. run-matrix.mjs drives window.__harness from
    playwright; the card APIs are answered by stub-apis.mjs via route
    interception. Everything between the canvas and the outcome is the REAL
    scan pipeline: identifyFrame → Tesseract OCR → match layer → corner refine.
  -->
  <script type="module">
    import { identifyFrame, clearScanCache } from '/src/lib/identify'
    import { frameHash } from '/src/lib/vision'
    import { useSettings } from '/src/lib/settings'
    import { warmOcr, stopOcr } from '/src/lib/ocr'
    import { scanTraces, clearScanTraces } from '/src/lib/scandebug'
    import { compose, DEGRADATIONS } from '/tests/harness/augment.mjs'
    import { detectCardRegions, refineCardCrop } from '/src/lib/vision'
    import { scanPage, PAGE_MAX_EDGE } from '/src/lib/multiscan'

    const images = new Map()
    async function loadImage(url) {
      if (images.has(url)) return images.get(url)
      const img = new Image()
      img.decoding = 'async'
      const done = new Promise((resolve, reject) => {
        img.onload = () => resolve(img)
        img.onerror = () => reject(new Error(`image failed: ${url}`))
      })
      img.src = url
      const loaded = await done
      images.set(url, loaded)
      return loaded
    }

    /**
     * A real photograph, scaled to what the app's capture would produce.
     * captureFrame() in lib/camera.ts caps the long edge at CAPTURE_MAX_EDGE
     * and hands identifyFrame the result, so a photo cell that skipped this
     * would be testing the pipeline at a resolution the app never sees.
     */
    function fitPhoto(img, maxEdge) {
      const w = img.naturalWidth ?? img.width
      const h = img.naturalHeight ?? img.height
      const scale = Math.min(1, maxEdge / Math.max(w, h))
      const canvas = document.createElement('canvas')
      canvas.width = Math.max(1, Math.round(w * scale))
      canvas.height = Math.max(1, Math.round(h * scale))
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.imageSmoothingEnabled = true
      ctx.imageSmoothingQuality = 'high'
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
      return canvas
    }

    window.__harness = {
      degradations: Object.keys(DEGRADATIONS),

      warm() {
        warmOcr()
        return true
      },

      /**
       * cell: { imageUrl, degradation, hint ('auto' | game), game, overrides?,
       *         stack?, photo? }
       * stack: N simulates the phone's dark-scene temporal averaging —
       * N composes of the SAME cell with different noise seeds, averaged.
       * Sensor noise is independent per frame; the augment noise is seeded,
       * so varying the seed per "frame" reproduces the same physics.
       * photo: the image is a REAL photograph, so it already contains
       * everything compose() exists to simulate — lens, sensor, lighting,
       * hand shake, and a genuine foil's diffraction, which a flat scan can
       * never show. Composing it again would degrade a degraded frame and
       * measure a camera nobody owns, so a photo cell bypasses compose()
       * entirely and is only resized to what the app's own capture would
       * hand identifyFrame (camera.ts CAPTURE_MAX_EDGE).
       * Returns { outcome, ms, trace }.
       */
      async runCell(cell) {
        // cloudKey is only ever present when the runner was given a real key
        // (--gemini); without it cloudScanRescue is false and the cloud branch
        // in identify.ts is never reached, so ordinary runs stay offline and
        // deterministic exactly as before.
        useSettings.getState().set({
          gameFilter: cell.hint ?? 'auto',
          pokemonKey: '',
          geminiKey: cell.cloudKey ?? '',
          cloudScanModel: cell.cloudModel ?? '',
          cloudScanRescue: !!cell.cloudKey,
        })
        const img = await loadImage(cell.imageUrl)
        let canvas
        if (cell.photo) {
          canvas = fitPhoto(img, cell.maxEdge ?? 1600)
        } else {
          const spec = { ...(DEGRADATIONS[cell.degradation] ?? {}), game: cell.game, ...(cell.overrides ?? {}) }
          canvas = compose(img, spec)
          if ((cell.stack ?? 1) > 1) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true })
            const base = ctx.getImageData(0, 0, canvas.width, canvas.height)
            const sum = new Float32Array(base.data.length)
            for (let i = 0; i < base.data.length; i++) sum[i] = base.data[i]
            for (let n = 1; n < cell.stack; n++) {
              const frame = compose(img, { ...spec, seed: (spec.seed ?? 1) + n * 7919 })
              const data = frame.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, canvas.width, canvas.height).data
              for (let i = 0; i < data.length; i++) sum[i] += data[i]
            }
            for (let i = 0; i < base.data.length; i++) base.data[i] = sum[i] / cell.stack
            ctx.putImageData(base, 0, 0)
          }
        }
        clearScanCache()
        clearScanTraces()
        const started = performance.now()
        let outcome
        try {
          outcome = await identifyFrame({ canvas }, frameHash(canvas), { ignoreMisses: true, mode: 'card' })
        } catch (err) {
          outcome = { ok: false, reason: 'exception', message: String(err?.message ?? err) }
        }
        const ms = Math.round(performance.now() - started)
        const trace = scanTraces()[0] ?? null
        return {
          ms,
          trace,
          outcome: outcome.ok
            ? {
                ok: true,
                name: outcome.card.name,
                game: outcome.card.game,
                setCode: outcome.card.setCode ?? null,
                number: outcome.card.number ?? null,
                readName: outcome.identification.name,
                via: outcome.identification.via,
                confidence: outcome.identification.confidence,
                foil: outcome.identification.foil ?? null,
                editionSet: outcome.identification.setCode ?? null,
                editionNumber: outcome.identification.number ?? null,
              }
            : { ok: false, reason: outcome.reason, message: outcome.message, readName: outcome.readName ?? null },
        }
      },

      /**
       * Render a composed cell to a PNG data URL. Looking at the picture is
       * the only check that catches a degradation modelling a failure that
       * does not happen — which is exactly how the first foil model (a
       * full-card rainbow) got as far as it did.
       */
      async preview(cell) {
        const img = await loadImage(cell.imageUrl)
        if (cell.photo) return fitPhoto(img, cell.maxEdge ?? 1600).toDataURL('image/png')
        const spec = { ...(DEGRADATIONS[cell.degradation] ?? {}), game: cell.game, ...(cell.overrides ?? {}) }
        return compose(img, spec).toDataURL('image/png')
      },

      /**
       * Run the multi-card sweep over an image and draw what it found, so a
       * human can LOOK at the boxes. A detector graded only by a pass rate
       * hides which cards it missed and which of its hits are the table.
       */
      async detect(cell) {
        const img = await loadImage(cell.imageUrl)
        const canvas = cell.photo
          ? fitPhoto(img, cell.maxEdge ?? 1600)
          : compose(img, { ...(DEGRADATIONS[cell.degradation] ?? {}), game: cell.game })
        const started = performance.now()
        const found = detectCardRegions(canvas, cell.maxCards ?? 12)
        const ms = Math.round(performance.now() - started)
        const ctx = canvas.getContext('2d')
        ctx.lineWidth = Math.max(2, canvas.width / 300)
        ctx.font = `${Math.max(14, Math.round(canvas.width / 45))}px sans-serif`
        found.forEach((r, i) => {
          const hue = (i * 47) % 360
          ctx.strokeStyle = `hsl(${hue} 95% 50%)`
          ctx.fillStyle = `hsl(${hue} 95% 50%)`
          const x = r.x * canvas.width
          const y = r.y * canvas.height
          const w = r.w * canvas.width
          const h = r.h * canvas.height
          ctx.strokeRect(x, y, w, h)
          ctx.fillRect(x, y - 20, 78, 20)
          ctx.fillStyle = '#000'
          ctx.fillText(`${i + 1}:${r.score.toFixed(2)}`, x + 3, y - 4)
        })
        return {
          image: canvas.toDataURL('image/jpeg', 0.85), found, ms,
          // lineRatio is reported because it is the measured single-card
          // orientation signal, and seeing it beside a page's result is what
          // showed it does NOT generalise to one (0.45 on a sideways page,
          // 1.23 and 1.47 on two others).
          lineRatio: Number((refineCardCrop(canvas).lineRatio ?? 0).toFixed(2)),
        }
      },

      /**
       * One capture built from REAL video frames.
       *
       * `imageUrls` is either a single frame — "would the scanner have
       * identified the card if it had grabbed this instant?" — or a burst of
       * consecutive ones, which are AVERAGED the way `captureFrameStacked`
       * averages three frames 70ms apart on the phone. Averaging real
       * consecutive frames is the honest version of that: the noise is
       * genuinely independent per frame and the specular pattern genuinely
       * moves, neither of which a seed-varied synthetic compose can claim.
       *
       * Frames are already at capture resolution from ingest-clip.mjs, so
       * nothing is resized here and nothing is composed — a video frame IS the
       * degraded input, as a photograph is.
       */
      async runFrames(cell) {
        // cloudKey is only ever present when the runner was given a real key
        // (--gemini); without it cloudScanRescue is false and the cloud branch
        // in identify.ts is never reached, so ordinary runs stay offline and
        // deterministic exactly as before.
        useSettings.getState().set({
          gameFilter: cell.hint ?? 'auto',
          pokemonKey: '',
          geminiKey: cell.cloudKey ?? '',
          cloudScanModel: cell.cloudModel ?? '',
          cloudScanRescue: !!cell.cloudKey,
        })
        const imgs = await Promise.all(cell.imageUrls.map(loadImage))
        const canvas = document.createElement('canvas')
        canvas.width = imgs[0].naturalWidth
        canvas.height = imgs[0].naturalHeight
        const ctx = canvas.getContext('2d', { willReadFrequently: true })
        ctx.drawImage(imgs[0], 0, 0)
        if (imgs.length > 1) {
          const base = ctx.getImageData(0, 0, canvas.width, canvas.height)
          const sum = new Float32Array(base.data.length)
          for (let i = 0; i < base.data.length; i++) sum[i] = base.data[i]
          for (let n = 1; n < imgs.length; n++) {
            const f = document.createElement('canvas')
            f.width = canvas.width
            f.height = canvas.height
            const fx = f.getContext('2d', { willReadFrequently: true })
            fx.drawImage(imgs[n], 0, 0, canvas.width, canvas.height)
            const d = fx.getImageData(0, 0, canvas.width, canvas.height).data
            for (let i = 0; i < d.length; i++) sum[i] += d[i]
          }
          for (let i = 0; i < base.data.length; i++) base.data[i] = sum[i] / imgs.length
          ctx.putImageData(base, 0, 0)
        }
        clearScanCache()
        clearScanTraces()
        const started = performance.now()
        let outcome
        try {
          outcome = await identifyFrame({ canvas }, frameHash(canvas), { ignoreMisses: true, mode: 'card' })
        } catch (err) {
          outcome = { ok: false, reason: 'exception', message: String(err?.message ?? err) }
        }
        return {
          ms: Math.round(performance.now() - started),
          trace: scanTraces()[0] ?? null,
          outcome: outcome.ok
            ? { ok: true, name: outcome.card.name, game: outcome.card.game, via: outcome.identification.via,
                confidence: outcome.identification.confidence, readName: outcome.identification.name }
            : { ok: false, reason: outcome.reason, message: outcome.message, readName: outcome.readName ?? null },
        }
      },

      /**
       * A whole page of cards: detectCardRegions, then a real identifyFrame
       * per crop — the same `scanPage` the app calls, not a reimplementation.
       *
       * Graded against an unordered MULTISET of names (run-matrix's
       * gradePage), because a page has no "the" answer: three copies of a card
       * mean three slots, and detection and identification fail independently.
       * The per-card JPEG each result carries is dropped here — it is for the
       * review screen, and shipping nine of them across the CDP bridge would
       * cost more than the scan.
       */
      async runPage(cell) {
        // cloudKey is only ever present when the runner was given a real key
        // (--gemini); without it cloudScanRescue is false and the cloud branch
        // in identify.ts is never reached, so ordinary runs stay offline and
        // deterministic exactly as before.
        useSettings.getState().set({
          gameFilter: cell.hint ?? 'auto',
          pokemonKey: '',
          geminiKey: cell.cloudKey ?? '',
          cloudScanModel: cell.cloudModel ?? '',
          cloudScanRescue: !!cell.cloudKey,
        })
        const img = await loadImage(cell.imageUrl)
        const canvas = cell.photo
          ? fitPhoto(img, cell.maxEdge ?? PAGE_MAX_EDGE)
          : compose(img, { ...(DEGRADATIONS[cell.degradation] ?? {}), game: cell.game })
        clearScanCache()
        clearScanTraces()
        const started = performance.now()
        const found = await scanPage(canvas, { maxCards: cell.maxCards ?? 12 })
        const ms = Math.round(performance.now() - started)
        return {
          ms,
          source: { w: canvas.width, h: canvas.height },
          found: found.map((f) => ({
            region: f.region,
            outcome: f.outcome.ok
              ? { ok: true, name: f.outcome.card.name, game: f.outcome.card.game, setCode: f.outcome.card.setCode ?? null,
                  number: f.outcome.card.number ?? null, via: f.outcome.identification.via,
                  confidence: f.outcome.identification.confidence, readName: f.outcome.identification.name }
              : { ok: false, reason: f.outcome.reason, message: f.outcome.message, readName: f.outcome.readName ?? null },
          })),
        }
      },

      async shutdown() {
        await stopOcr()
        return true
      },
    }
    document.title = 'harness-ready'
  </script>
</body>
