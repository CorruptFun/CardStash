# The catalog mirror's ingestion, automated (migration 0022, decision 28).
#
# Two modes, decided by whether the repo has a SUPABASE_SECRET secret:
#
#   * WITHOUT it (any fork, day one): a --dry-run against the LIVE bulk
#     APIs. This is the mapper smoke test the sandboxed unit tests cannot
#     be — Scryfall/TCGdex/YGOPRODeck response shapes drift, and a dry-run
#     here catches that before an operator run does.
#   * WITH it: the real weekly sync — upsert all three sources, fingerprint
#     artwork newest-first (the hash pass is resumable, so the weekly slice
#     keeps eating into the backlog), then print per-game coverage.
#
# The schedule only fires on the default branch, so this stays inert until
# merged. Rows written here are read anonymously by lib/catalog.ts; the
# service key never leaves the job. Off-hour minute on purpose.

name: Sync catalog mirror

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Sources to ingest (comma-separated: mtg,pokemon,yugioh)'
        default: 'mtg,pokemon,yugioh'
      hash_limit:
        description: 'Artwork fingerprints to compute this run'
        default: '2000'
  schedule:
    - cron: '23 9 * * 1' # Mondays 09:23 UTC
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/sync-catalog.mjs'
      - '.github/workflows/sync-catalog.yml'

permissions:
  contents: read

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      HAS_SECRET: ${{ secrets.SUPABASE_SECRET != '' }}
      SOURCES: ${{ inputs.source || 'mtg,pokemon,yugioh' }}
      HASH_LIMIT: ${{ inputs.hash_limit || '2000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dry-run the mappers against the live APIs (no secret configured)
        if: env.HAS_SECRET != 'true'
        # Pokémon capped to the newest sets: a shape change shows up there
        # first, and a full 150-set sweep proves nothing more in a smoke.
        run: node scripts/sync-catalog.mjs --dry-run --source="$SOURCES" --sets=6

      - name: Sync the mirror
        if: env.HAS_SECRET == 'true'
        run: node scripts/sync-catalog.mjs --source="$SOURCES"

      - name: Fingerprint artwork (resumable slice, newest first)
        if: env.HAS_SECRET == 'true'
        env:
          # The hash pass runs the app's own cardArtHash in a real browser;
          # the runner image ships Chrome, and only this step needs deps.
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm ci
          node scripts/sync-catalog.mjs --hash --limit="$HASH_LIMIT"

      - name: Coverage report
        if: env.HAS_SECRET == 'true'
        run: node scripts/sync-catalog.mjs --stats
