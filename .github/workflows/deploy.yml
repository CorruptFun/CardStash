name: Deploy site

# gh-pages is a build-output mirror, regenerated from source on every push to
# main. Never edit gh-pages by hand and never commit build output to main —
# this workflow force-pushes the mirror from whatever main contains.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The OAuth client id for free-tier Drive backup (lib/drive.ts). Public
          # by construction — a browser token flow has no client secret and this
          # value ships inside the bundle either way, so hiding it in a secret
          # would buy nothing and add a step that can be silently forgotten
          # (a missing id makes backup vanish rather than fail loudly).
          # What actually protects it is the Authorised JavaScript origins list
          # on the client itself: a token can only be minted from
          # localhost:5173 and corruptfun.github.io.
          # The client SECRET is unused and must never appear in this repo.
          # To rotate without a commit, replace the literal with
          # ${{ vars.VITE_GOOGLE_CLIENT_ID }} and set the repo variable.
          VITE_GOOGLE_CLIENT_ID: 522632498220-ak548mr1qgb0g0kg1q42nfmq99kfsaj2.apps.googleusercontent.com
          # Our PSA token for slab cert lookup (lib/psa.ts). Unset = the feature
          # is dormant and slab scanning still reads the label, so a missing
          # secret degrades rather than breaks the build.
          #
          # This one IS a real credential, so it comes from a secret rather than
          # a literal — but be clear about what that buys: it keeps the token
          # out of the repo, NOT out of the bundle. Vite substitutes it into the
          # JavaScript published to gh-pages, where anyone can read it, and the
          # ~100/day free quota is shared across all users. Prefer pointing
          # VITE_PSA_ENDPOINT at a proxy that holds the token server-side.
          VITE_PSA_TOKEN: ${{ secrets.VITE_PSA_TOKEN }}
          VITE_PSA_ENDPOINT: ${{ vars.VITE_PSA_ENDPOINT }}
      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          {
            echo "# Cardstock — deploy mirror"
            echo
            echo "Built site for **Cardstock**, generated by CI from the \`main\` branch — do not edit by hand."
            echo
            echo "**Live: https://corruptfun.github.io/CardStash/** · Source: [\`main\`](https://github.com/${GITHUB_REPOSITORY}/tree/main)"
          } > README.md
          git init -q -b gh-pages
          git config user.name "cardstock-deploy"
          git config user.email "deploy@invalid"
          git add -A
          git commit -q -m "deploy $(date -u +%Y-%m-%dT%H:%M)Z from ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
