name: Deploy site

# gh-pages is a build-output mirror, regenerated from source on every push to
# main. Never edit gh-pages by hand and never commit build output to main —
# this workflow force-pushes the mirror from whatever main contains.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          {
            echo "# Cardstock — deploy mirror"
            echo
            echo "Built site for **Cardstock**, generated by CI from the \`main\` branch — do not edit by hand."
            echo
            echo "**Live: https://corruptfun.github.io/CardStash/** · Source: [\`main\`](https://github.com/${GITHUB_REPOSITORY}/tree/main)"
          } > README.md
          git init -q -b gh-pages
          git config user.name "cardstock-deploy"
          git config user.email "deploy@invalid"
          git add -A
          git commit -q -m "deploy $(date -u +%Y-%m-%dT%H:%M)Z from ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
