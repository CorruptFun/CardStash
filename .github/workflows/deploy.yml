name: Deploy site

# gh-pages is a build-output mirror, regenerated from source on every push to
# main. Never edit gh-pages by hand and never commit build output to main —
# this workflow force-pushes the mirror from whatever main contains.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The OAuth client id for free-tier Drive backup (lib/drive.ts). Public
          # by construction — a browser token flow has no client secret and this
          # value ships inside the bundle either way, so hiding it in a secret
          # would buy nothing and add a step that can be silently forgotten
          # (a missing id makes backup vanish rather than fail loudly).
          # What actually protects it is the Authorised JavaScript origins list
          # on the client itself: a token can only be minted from an origin on
          # that list — localhost:5173, corruptfun.github.io, and
          # cardstock.corrupt.solutions. A new origin serving this bundle gets
          # Drive backup that fails at consent until it is added there.
          # The client SECRET is unused and must never appear in this repo.
          # To rotate without a commit, replace the literal with
          # ${{ vars.VITE_GOOGLE_CLIENT_ID }} and set the repo variable.
          VITE_GOOGLE_CLIENT_ID: 522632498220-ak548mr1qgb0g0kg1q42nfmq99kfsaj2.apps.googleusercontent.com
          # Slab cert lookup (lib/psa.ts) — two shapes, prefer the endpoint.
          #
          # VITE_PSA_ENDPOINT (a repo VARIABLE, not a secret — it is a public
          # URL) points builds at supabase/functions/psa-proxy, which holds
          # the real token server-side as the PSA_TOKEN Supabase secret. With
          # it set the bundle ships NO token at all and calls the proxy
          # keyless. The value to set:
          #   https://xvfuyvaehtdxroyzixak.supabase.co/functions/v1/psa-proxy
          #
          # VITE_PSA_TOKEN is the legacy direct-to-PSA shape. It IS a real
          # credential, so it comes from a secret rather than a literal — but
          # be clear about what that buys: it keeps the token out of the repo,
          # NOT out of the bundle. Vite substitutes it into the JavaScript
          # published to gh-pages, where anyone can read it. Leave it unset
          # once the endpoint is set — the endpoint wins, and psa.ts refuses
          # to send the token to the proxy host anyway.
          #
          # With NEITHER value the feature is dormant and slab scanning still
          # reads the label, so a missing value degrades rather than breaks.
          VITE_PSA_TOKEN: ${{ secrets.VITE_PSA_TOKEN }}
          VITE_PSA_ENDPOINT: ${{ vars.VITE_PSA_ENDPOINT }}
      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          # The custom domain, emitted on every deploy and NOT set by hand.
          # This workflow rebuilds gh-pages from scratch (git init + force push),
          # so a CNAME added through the Pages settings UI lives on the branch
          # and is therefore wiped by the next deploy — the site would fall back
          # to corruptfun.github.io/CardStash mid-session. Emitting it here is
          # what makes the domain survive.
          #
          # The bundle itself is origin-agnostic (vite `base: './'` and the
          # webmanifest's relative start_url/scope), so nothing else changes
          # when the domain does.
          echo "cardstock.corrupt.solutions" > CNAME
          {
            echo "# Cardstock — deploy mirror"
            echo
            echo "Built site for **Cardstock**, generated by CI from the \`main\` branch — do not edit by hand."
            echo
            echo "**Live: https://cardstock.corrupt.solutions** · Source: [\`main\`](https://github.com/${GITHUB_REPOSITORY}/tree/main)"
          } > README.md
          git init -q -b gh-pages
          git config user.name "cardstock-deploy"
          git config user.email "deploy@invalid"
          git add -A
          git commit -q -m "deploy $(date -u +%Y-%m-%dT%H:%M)Z from ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
