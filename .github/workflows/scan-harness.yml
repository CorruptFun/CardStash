name: Scan harness fixtures

# The scan-pipeline regression harness (tests/harness) needs REAL card
# imagery and API datasets, which restricted dev sandboxes can't always
# download. This workflow fetches them where the open internet is reachable
# and publishes the result to the `harness-fixtures` branch — a
# machine-generated data branch (like gh-pages): force-pushed, never merged,
# never edited by hand. Consumers run:
#   git fetch origin harness-fixtures
#   git --work-tree=tests/harness/fixtures checkout origin/harness-fixtures -- .

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'tests/harness/fetch-fixtures.mjs'
      - '.github/workflows/scan-harness.yml'

permissions:
  contents: write

concurrency:
  group: scan-harness-fixtures
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/harness/fetch-fixtures.mjs
      - name: Publish fixtures to the harness-fixtures branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tests/harness/fixtures
          {
            echo "# Cardstock scan-harness fixtures"
            echo
            echo "Machine-generated by \`.github/workflows/scan-harness.yml\` — real card"
            echo "images + API datasets consumed by \`tests/harness\`. Do not edit; re-run"
            echo "the workflow to refresh. Never merge this branch."
          } > README.md
          git init -q -b harness-fixtures
          git config user.name "cardstock-harness"
          git config user.email "harness@invalid"
          git add -A
          git commit -q -m "fixtures $(date -u +%Y-%m-%dT%H:%M)Z from ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" harness-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: scan-harness-fixtures
          path: tests/harness/fixtures
          retention-days: 14
